exclude = '^vendor/|(^|/)(slang_rt|slang-rt|third_party|thirdparty)/|_emit\.cpp$|\.gen\.cpp$|\.inc$|pheno_spv\.h$|^guest/drape_support/'

[[repos]]
repo = "https://github.com/pre-commit/mirrors-clang-format"
rev = "v22.1.5"

[[repos.hooks]]
id = "clang-format"
files = '\.(c|h|cpp|hpp|cc|hh|cxx|hxx|inc)$'
types_or = ["text"]
